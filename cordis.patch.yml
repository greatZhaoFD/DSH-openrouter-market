# dsh-openrouter-market bundle patch (official DSH plugin bundle format).
#
# The row mounts the Host half (data routes + routing policy store); the
# package's `dsh.client` manifest loads the Client half into the
# "settings.models.footer" and "shell.overlay" slots. Install this package
# through the DSH Plugin Manager / Plugins page, a plugin market index, or
# `dsh plugin add` — not by hand-editing a profile patch alongside it.
- insert:
    - id: openrouter-models
      name: 'dsh-openrouter-market'
      config:
        # OpenRouter API root. Change only for a compatible proxy.
        apiBaseUrl: https://openrouter.ai/api/v1
        # Name of the credential DSH supplies; the key itself stays in DSH.
        apiKeyEnv: OPENROUTER_API_KEY
        # Catalogue cache lifetimes: 6 h for models, 15 min for provider data.
        modelsTtlMs: 21600000
        endpointsTtlMs: 900000
        timeoutMs: 25000
        # Off by default: the wrapper that injects saved routing strategies
        # into chat requests is opt-in. Flip to true in a profile override to
        # apply saved strategies at request time.
        enableRouting: false
